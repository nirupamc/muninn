[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "munin"
version = "0.1.0"
description = "Standalone, local-first long-term memory layer for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Munin" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.0.0",
    "sentence-transformers>=3.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
munin = "app.cli:main"
munin-agent = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
